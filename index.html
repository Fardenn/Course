<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes courses</title>
<meta name="theme-color" content="#2447E0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#EEF1F7;--card:#fff;--ink:#141A33;--mute:#65708F;--line:#D9DFEC;--acc:#2447E0;--on:#fff;--soft:#E4EAFB;--danger:#B3261E;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1224;--card:#171C33;--ink:#EEF1FB;--mute:#98A2C4;--line:#2A3152;--acc:#6F8BFF;--on:#0E1224;--soft:#222A4D;--danger:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1224;--card:#171C33;--ink:#EEF1FB;--mute:#98A2C4;--line:#2A3152;--acc:#6F8BFF;--on:#0E1224;--soft:#222A4D;--danger:#FF8A80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:560px;margin:0 auto;padding:0 16px 96px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;padding:14px 0 10px}
nav button{flex:1;padding:12px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;font:800 17px inherit;font-family:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--on)}
nav i{font-style:normal;margin-left:6px;opacity:.8}
h1{font-size:15px;font-weight:600;color:var(--mute);margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0;font-size:20px;font-weight:800}
.meta{color:var(--mute);font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{border:0;background:var(--acc);color:var(--on);font-weight:600;border-radius:12px;padding:10px 14px}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:400;border-radius:12px;padding:9px 12px}
.ghost.bad{color:var(--danger)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
textarea{min-height:130px;resize:vertical}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 6px}
.ing{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.plus{border:0;background:var(--soft);color:var(--acc);width:34px;height:34px;border-radius:10px;font-size:20px;line-height:1}
.item{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);padding:13px 2px}
.item:first-child{border-top:0}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--mute);display:grid;place-items:center;font-size:16px;color:transparent}
.item.done{color:var(--mute);text-decoration:line-through}
.item.done .box{background:var(--acc);border-color:var(--acc);color:var(--on)}
.qty{margin-left:auto;font-weight:800;color:var(--acc)}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:20}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<main>
<nav role="tablist">
  <button role="tab" id="t-r" data-a="tab" data-v="r">Recettes</button>
  <button role="tab" id="t-c" data-a="tab" data-v="c">Courses<i id="cnt"></i></button>
</nav>
<div id="app"></div>
</main>
<div id="toast" role="status"></div>
<script>
(function(){
var K="courses-v1",S={recipes:[],list:[]},tab="r",open={},edit=null,form=false,arm=false;
try{var x=JSON.parse(localStorage.getItem(K));if(x&&x.recipes&&x.list)S=x}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function key(t){return t.trim().toLowerCase()}
function add(t){t=t.trim();if(!t)return;var f=S.list.find(function(i){return key(i.t)===key(t)});if(f){f.n++;f.d=false}else S.list.push({t:t,n:1,d:false})}
var tm;function toast(m){var e=document.getElementById("toast");e.textContent=m;e.className="on";clearTimeout(tm);tm=setTimeout(function(){e.className=""},2200)}
function recipes(){
  var h="";
  if(form){
    var r=edit!==null?S.recipes[edit]:{name:"",ing:[]};
    h+='<div class="card"><label for="fn" style="margin-top:0">Nom de la recette</label><input id="fn" value="'+esc(r.name)+'" placeholder="Quiche lorraine">'+
    '<label for="fi">Ingrédients (un par ligne)</label><textarea id="fi" placeholder="pâte brisée&#10;200 g de lardons&#10;3 œufs">'+esc(r.ing.join("\n"))+'</textarea>'+
    '<div class="acts"><button class="btn" data-a="save">Enregistrer</button><button class="ghost" data-a="cancel">Annuler</button></div></div>';
  }else h+='<button class="btn" style="width:100%;margin-bottom:12px;padding:13px" data-a="new">Nouvelle recette</button>';
  if(!S.recipes.length&&!form)h+='<div class="empty">Aucune recette pour l’instant.<br>Ajoutez-en une avec ses ingrédients : un tap les envoie dans vos courses.</div>';
  S.recipes.forEach(function(r,i){
    h+='<div class="card"><div class="row sp"><h2>'+esc(r.name)+'</h2><span class="meta">'+r.ing.length+' ingrédient'+(r.ing.length>1?"s":"")+'</span></div>'+
    '<div class="acts"><button class="btn" data-a="addr" data-i="'+i+'">Ajouter à ma liste</button><button class="ghost" data-a="view" data-i="'+i+'">'+(open[i]?"Masquer":"Voir")+'</button><button class="ghost" data-a="edit" data-i="'+i+'">Modifier</button><button class="ghost bad" data-a="del" data-i="'+i+'">Supprimer</button></div>';
    if(open[i])r.ing.forEach(function(g,j){h+='<div class="ing"><span>'+esc(g)+'</span><button class="plus" aria-label="Ajouter '+esc(g)+' à ma liste" data-a="addi" data-i="'+i+'" data-j="'+j+'">+</button></div>'});
    h+='</div>';
  });
  return h;
}
function courses(){
  var h='<div class="card"><div class="row"><input id="ni" placeholder="Ajouter un article" aria-label="Ajouter un article"><button class="btn" data-a="addm" style="flex:none">Ajouter</button></div></div>';
  if(!S.list.length)return h+'<div class="empty">Votre liste est vide.<br>Ajoutez une recette depuis l’onglet Recettes.</div>';
  h+='<div class="card" style="padding:6px 14px">';
  S.list.forEach(function(it,i){h+='<button class="item'+(it.d?" done":"")+'" data-a="tog" data-i="'+i+'" aria-pressed="'+it.d+'"><span class="box">✓</span><span>'+esc(it.t)+'</span>'+(it.n>1?'<span class="qty">×'+it.n+'</span>':"")+'</button>'});
  h+='</div><div class="acts"><button class="ghost" data-a="clean">Retirer les cochés</button><button class="ghost bad" data-a="clear">'+(arm?"Confirmer : tout vider":"Tout vider")+'</button></div>';
  return h;
}
function render(){
  document.getElementById("t-r").setAttribute("aria-selected",tab==="r");
  document.getElementById("t-c").setAttribute("aria-selected",tab==="c");
  var n=S.list.filter(function(i){return!i.d}).length;
  document.getElementById("cnt").textContent=n?n:"";
  document.getElementById("app").innerHTML=(tab==="r"?"<h1>Mes recettes</h1>":"<h1>À acheter</h1>")+(tab==="r"?recipes():courses());
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
  if(a!=="clear")arm=false;
  if(a==="tab"){tab=b.dataset.v}
  else if(a==="new"){form=true;edit=null}
  else if(a==="cancel"){form=false;edit=null}
  else if(a==="edit"){form=true;edit=i}
  else if(a==="view"){open[i]=!open[i]}
  else if(a==="del"){S.recipes.splice(i,1);open={};save()}
  else if(a==="save"){
    var nm=document.getElementById("fn").value.trim();
    var ing=document.getElementById("fi").value.split("\n").map(function(s){return s.trim()}).filter(Boolean);
    if(!nm||!ing.length){toast("Indiquez un nom et au moins un ingrédient");return}
    var r={name:nm,ing:ing};if(edit!==null)S.recipes[edit]=r;else S.recipes.push(r);
    form=false;edit=null;save();toast("Recette enregistrée");
  }
  else if(a==="addr"){S.recipes[i].ing.forEach(add);save();toast(S.recipes[i].name+" : "+S.recipes[i].ing.length+" ajoutés à la liste")}
  else if(a==="addi"){add(S.recipes[i].ing[j]);save();toast("Ajouté à la liste")}
  else if(a==="addm"){var inp=document.getElementById("ni");add(inp.value);save()}
  else if(a==="tog"){S.list[i].d=!S.list[i].d;save()}
  else if(a==="clean"){S.list=S.list.filter(function(x){return!x.d});save()}
  else if(a==="clear"){if(arm){S.list=[];arm=false;save()}else arm=true}
  render();
  if(a==="addm"){var n=document.getElementById("ni");if(n)n.focus()}
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="ni"){add(e.target.value);save();render();var n=document.getElementById("ni");if(n)n.focus()}});
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
</script>
</body>
</html>
