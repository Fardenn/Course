<style>
:root{--bg:#EEF1F7;--card:#fff;--ink:#141A33;--mute:#65708F;--line:#D9DFEC;--acc:#2447E0;--on:#fff;--soft:#E4EAFB;--danger:#B3261E;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0E1224;--card:#171C33;--ink:#EEF1FB;--mute:#98A2C4;--line:#2A3152;--acc:#6F8BFF;--on:#0E1224;--soft:#222A4D;--danger:#FF8A80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:560px;margin:0 auto;padding:0 16px 96px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;padding:14px 0 10px}

nav button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--on)}
nav i{font-style:normal;margin-left:6px;opacity:.8}
h1{font-size:15px;font-weight:600;color:var(--mute);margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0;font-size:20px;font-weight:800}
.meta{color:var(--mute);font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{border:0;background:var(--acc);color:var(--on);font-weight:600;border-radius:12px;padding:10px 14px}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:9px 12px}
.ghost.bad{color:var(--danger)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
input{width:100%}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
.ing{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.plus{border:0;background:var(--soft);color:var(--acc);width:34px;height:34px;flex:none;border-radius:10px;font-size:20px;line-height:1}
.item{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);padding:13px 2px}
.item:first-child{border-top:0}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--mute);display:grid;place-items:center;font-size:16px;color:transparent}
.item.done{color:var(--mute);text-decoration:line-through}
.item.done .box{background:var(--acc);border-color:var(--acc);color:var(--on)}
.qty{margin-left:auto;font-weight:800;color:var(--acc);white-space:nowrap}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.rowi{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.gu{width:112px;flex:none;padding:8px 6px}
.ing>span{flex:1;min-width:0}
.src{overflow-wrap:anywhere}
a{color:var(--acc)}
.rn{flex:1;min-width:0;font-weight:600}
.qi{width:76px;flex:none}
.ui{width:112px;flex:none;padding:10px 6px}
.combo{position:relative;margin-top:10px}
.dd{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;max-height:250px;overflow:auto;z-index:4;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.opt{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);padding:12px}
.opt:first-child{border-top:0}
.opt.new{color:var(--acc);font-weight:600}
.head{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:0;background:transparent;color:var(--ink);padding:4px 0}
.title{font-size:20px;font-weight:800}
.plus.big{width:42px;height:42px;font-size:26px;background:var(--acc);color:var(--on)}
.plus.x{background:transparent;color:var(--danger);font-size:18px}
.plus.x.arm{background:var(--danger);color:var(--on);width:auto;padding:0 12px;font-size:14px;font-weight:600}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--soft)}
.plus.minus,.plus.big.minus{background:var(--soft);color:var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:20}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

function defs(){return DEF.map(function(o){return{n:o.n,u:o.u}})}
function unitOf(n){var k=fold(n);for(var i=0;i<S.ing.length;i++)if(fold(S.ing[i].n)===k)return S.ing[i].u||"";return""}
try{var x=JSON.parse(localStorage.getItem(K));if(x&&x.recipes&&x.list)S=x;if(!S.cat)S.cat=[]}catch(e){}

function fold(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/œ/g,"oe").trim()}
function uniq(a){var m={};return a.filter(function(o){var k=fold(o.n);if(m[k])return false;m[k]=1;return true})}

function fam(u){return u==="g"||u==="kg"?"m":u==="ml"||u==="cl"||u==="l"?"v":u===""?"n":u}
function base(q,u){return u==="kg"||u==="l"?q*1000:u==="cl"?q*10:q}
function add(n,q,u){var k=key(n),f=fam(u),b=q==null?null:base(q,u);
  var it=S.list.find(function(i){return i.k===k&&i.f===f})||(b==null?S.list.find(function(i){return i.k===k}):null);
  if(it){if(b!=null)it.q=(it.q||0)+b;it.d=false}else S.list.push({n:n,k:k,f:f,q:b,d:false})}

  var i=S.list.findIndex(function(x){return x.k===k&&x.f===f});

    '<button class="plus big minus" data-a="subr" data-i="'+i+'" aria-label="Retirer '+esc(r.name)+' de ma liste">−</button>'+
    '<button class="plus big" data-a="addr" data-i="'+i+'" aria-label="Ajouter '+esc(r.name)+' à ma liste">+</button>'+
    '<button class="plus x'+(armD===i?" arm":"")+'" data-a="del" data-i="'+i+'" aria-label="Supprimer '+esc(r.name)+'">'+(armD===i?"Supprimer ?":"✕")+'</button></div>';
    if(open[i]){r.ing.forEach(function(g,j){h+='<div class="ing"><span>'+esc(itx(g))+'</span><div class="row" style="gap:6px;flex:none"><button class="plus minus" aria-label="Retirer '+esc(g.n)+' de ma liste" data-a="subi" data-i="'+i+'" data-j="'+j+'">−</button><button class="plus" aria-label="Ajouter '+esc(g.n)+' à ma liste" data-a="addi" data-i="'+i+'" data-j="'+j+'">+</button></div></div>'});if(/^https?:\/\//.test(r.url||""))h+='<div class="ing"><a href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer">Voir la recette d’origine</a></div>';h+='<div class="acts"><button class="ghost" data-a="edit" data-i="'+i+'">Modifier la recette</button></div>'}
    h+='</div>';
  });
  return h;
}
function courseOrder(){return S.list.map(function(_,i){return i}).sort(function(a,b){return(S.list[a].d?1:0)-(S.list[b].d?1:0)||a-b})}
function courses(){
  var h='<div class="card"><div class="row"><input id="ni" placeholder="Ajouter un article (ex. 2 kg pommes de terre)" aria-label="Ajouter un article"><button class="btn" data-a="addm" style="flex:none">Ajouter</button></div></div>';
  if(!S.list.length)return h+'<div class="empty">Votre liste est vide.<br>Ajoutez une recette depuis l’onglet Recettes.</div>';
  h+='<div class="card" style="padding:6px 14px">';
  courseOrder().forEach(function(i){var it=S.list[i];h+='<button class="item'+(it.d?" done":"")+'" data-a="tog" data-i="'+i+'" aria-pressed="'+it.d+'"><span class="box">✓</span><span>'+esc(it.n)+'</span>'+(it.q!=null?'<span class="qty">'+esc(fq(it.q,it.f))+'</span>':"")+'</button>'});
  h+='</div><div class="acts"><button class="ghost" data-a="clean">Retirer les cochés</button><button class="ghost bad" data-a="clear">'+(arm?"Confirmer : tout vider":"Tout vider")+'</button></div>';
  return h;
}
var RELAY="https://recettes-import.nicolas-domer.workers.dev";
function cleanName(n){return String(n||"").replace(/\s*:\s*la meilleure recette\s*$/i,"").trim()}
function normLine(s){
  s=String(s).replace(/\u00a0/g," ").replace(/'/g,"’").replace(/\s*\([^)]*\)/g,"").replace(/\s+/g," ").trim();
  var fr={"½":0.5,"¼":0.25,"¾":0.75,"⅓":0.33,"⅔":0.67};
  s=s.replace(/(\d+)?\s?([½¼¾⅓⅔])/g,function(_,a,b){return String((a?+a:0)+fr[b])});
  s=s.replace(/(\d+)\s*\/\s*(\d+)/g,function(_,a,b){return String(+(a/b).toFixed(2))});
  s=s.replace(/\bcuill?[eè]res?\s+à\s+soupe/gi,"c. à soupe").replace(/\bcuill?[eè]res?\s+à\s+caf[eé]/gi,"c. à café").replace(/\bcàs\b/gi,"c. à soupe").replace(/\bcàc\b/gi,"c. à café");
  s=s.replace(/\b(grammes?|gr)\b/gi,"g").replace(/\bcentilitres?\b/gi,"cl").replace(/\bmillilitres?\b/gi,"ml").replace(/\blitres?\b/gi,"l").replace(/\bkilos?\b/gi,"kg");
  return s;
}
function toDraft(line){var p=parse(line),k=key(p.n),c=S.ing.find(function(o){return key(o.n)===k});return{n:c?c.n:p.n,q:p.q==null?"":num(p.q),u:p.u}}
function importPanel(){
  return'<div class="card"><label for="iu" style="margin-top:0">Lien de la recette (Marmiton)</label><input id="iu" inputmode="url" autocomplete="off" placeholder="https://www.marmiton.org/recettes/…">'+
  '<div id="is" class="meta" role="status" style="margin-top:10px"></div>'+
  '<div class="acts"><button class="btn" data-a="fetch">Récupérer les ingrédients</button><button class="ghost" data-a="icancel">Annuler</button></div></div>';
}
function shrink(src,cb){var im=new Image();im.onload=function(){try{var c=document.createElement("canvas"),n=160,w=im.naturalWidth,h=im.naturalHeight,z=Math.min(w,h);c.width=c.height=n;c.getContext("2d").drawImage(im,(w-z)/2,(h-z)/2,z,z,0,0,n,n);cb(c.toDataURL("image/jpeg",0.75))}catch(e){cb("")}};im.onerror=function(){cb("")};im.src=src}
function doFetch(){
  var u=document.getElementById("iu").value.trim(),r=RELAY,st=document.getElementById("is");
  if(!/^https?:\/\//i.test(u)){st.textContent="Collez le lien complet de la recette (https://…).";return}
  st.textContent="Récupération en cours…";
  fetch(r+"/?url="+encodeURIComponent(u)).then(function(x){return x.json().catch(function(){return{error:"Réponse illisible du relais"}})}).then(function(d){
    if(d.error||!d.ingredients||!d.ingredients.length){st.textContent=d.error||"Aucun ingrédient trouvé sur cette page.";return}
    var finish=function(img){draft={name:cleanName(d.name),url:d.url||u,img:img,ing:d.ingredients.map(toDraft)};imp=false;form=true;edit=null;render();
      toast(d.ingredients.length+" ingrédients importés"+(img?"":" (sans image)"))};
    if(d.imageData)shrink(d.imageData,function(t){finish(t||d.image||"")});else finish(d.image||"");
  }).catch(function(){st.textContent="Impossible de joindre le relais : vérifiez son adresse."});
}
function ingredientsView(){return'<h1>Mes ingrédients</h1><div class="card"><input id="gq" placeholder="Rechercher ou ajouter un ingrédient" autocomplete="off" aria-label="Rechercher ou ajouter un ingrédient"><div id="il"></div></div>'}
function renderIng(){
  var q=document.getElementById("gq"),el=document.getElementById("il");if(!q||!el)return;
  var t=fold(q.value),v=q.value.trim();
  var res=S.ing.filter(function(o){return!t||fold(o.n).indexOf(t)>=0}).sort(function(a,b){return a.n.localeCompare(b.n,"fr")});
  var h="";
  if(t&&!S.ing.some(function(o){return fold(o.n)===t}))h+='<button class="opt new" data-a="gadd" data-n="'+esc(v)+'">Ajouter « '+esc(v)+' » à la liste</button>';
  h+=res.map(function(o){return'<div class="ing"><span>'+esc(o.n)+'</span><select class="gu" data-n="'+esc(o.n)+'" aria-label="Unité de '+esc(o.n)+'">'+UL.map(function(u){return'<option value="'+esc(u)+'"'+(u===o.u?" selected":"")+'>'+(u||"unité")+'</option>'}).join("")+'</select><button class="plus x" data-a="ding" data-n="'+esc(o.n)+'" aria-label="Retirer '+esc(o.n)+'">✕</button></div>'}).join("");
  h+='<div class="acts"><button class="ghost bad" data-a="greset">'+(armR?"Confirmer : remettre la liste de base":"Remettre la liste de base")+'</button></div>';
  el.innerHTML=h;
}
function render(){
  document.getElementById("t-r").setAttribute("aria-selected",tab==="r");
  document.getElementById("t-c").setAttribute("aria-selected",tab==="c");
  document.getElementById("t-i").setAttribute("aria-selected",tab==="i");
  var n=S.list.filter(function(i){return!i.d}).length;
  document.getElementById("cnt").textContent=n?n:"";
  document.getElementById("app").innerHTML=tab==="r"?"<h1>Mes recettes</h1>"+recipes():tab==="i"?ingredientsView():"<h1>À acheter</h1>"+courses();
  if(tab==="i")renderIng();
}
document.addEventListener("click",function(e){
  var dd=document.getElementById("dd");if(dd&&!e.target.closest(".combo"))dd.hidden=true;
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
  if(a!=="greset")armR=false;
  if(a==="ding"){S.ing=S.ing.filter(function(o){return o.n!==b.dataset.n});save();renderIng();return}
  if(a==="gadd"){var nn=b.dataset.n;if(nn&&!S.ing.some(function(o){return fold(o.n)===fold(nn)})){S.ing.push({n:nn,u:""});save()}document.getElementById("gq").value="";renderIng();return}
  if(a==="greset"){if(armR){S.ing=defs();armR=false;save()}else armR=true;renderIng();return}
  if(a==="fetch"){doFetch();return}
  if(a!=="clear")arm=false;
  if(a!=="del")armD=-1;
  if(a==="tab"){tab=b.dataset.v}
  else if(a==="new"){form=true;edit=null;draft={name:"",url:"",ing:[]}}
  else if(a==="imp"){imp=true}
  else if(a==="icancel"){imp=false}
  else if(a==="cancel"){form=false;edit=null}
  else if(a==="edit"){form=true;edit=i;var r=S.recipes[i];draft={name:r.name,url:r.url||"",img:r.img||"",ing:r.ing.map(function(g){return{n:g.n,q:g.q==null?"":num(g.q),u:g.u}})}}
  else if(a==="view"){open[i]=!open[i]}
  else if(a==="del"){if(armD===i){S.recipes.splice(i,1);open={};armD=-1;save()}else armD=i}
  else if(a==="pick"){
    var nm=b.dataset.n;if(!nm)return;
    if(!S.ing.some(function(o){return fold(o.n)===fold(nm)})){S.ing.push({n:nm,u:""});save()}
    draft.ing.push({n:nm,q:"",u:unitOf(nm)});
  }
  else if(a==="rmrow"){draft.ing.splice(j,1)}
  else if(a==="save"){
    var name=draft.name.trim();
    if(!name||!draft.ing.length){toast("Indiquez un nom et au moins un ingrédient");return}
    var ing=draft.ing.map(function(g){var q=parseFloat(String(g.q).replace(",","."));return{n:g.n,q:isNaN(q)||q<=0?null:q,u:g.u}});
    var rc={name:name,ing:ing};if(draft.url)rc.url=draft.url;if(draft.img)rc.img=draft.img;ing.forEach(function(g){if(!S.ing.some(function(o){return fold(o.n)===fold(g.n)}))S.ing.push({n:g.n,u:g.u})});if(edit!==null)S.recipes[edit]=rc;else S.recipes.push(rc);
    form=false;edit=null;save();toast("Recette enregistrée");
  }
  else if(a==="addr"){var rr=S.recipes[i];rr.ing.forEach(function(g){add(g.n,g.q,g.u)});save();toast(rr.name+" : "+rr.ing.length+" ingrédients ajoutés")}
  else if(a==="addi"){var g=S.recipes[i].ing[j];add(g.n,g.q,g.u);save();toast("Ajouté à la liste")}
  else if(a==="subr"){var sr=S.recipes[i];sr.ing.forEach(function(g){sub(g.n,g.q,g.u)});save();toast(sr.name+" : ingrédients retirés de la liste")}
  else if(a==="subi"){var sg=S.recipes[i].ing[j];sub(sg.n,sg.q,sg.u);save();toast("Retiré de la liste")}
  else if(a==="addm"){var p=parse(document.getElementById("ni").value);if(p.n)add(p.n,p.q,p.u);save()}
  else if(a==="tog"){S.list[i].d=!S.list[i].d;save()}
  else if(a==="clean"){S.list=S.list.filter(function(x){return!x.d});save()}
  else if(a==="clear"){if(arm){S.list=[];arm=false;save()}else arm=true}
  render();
  if(a==="pick"){var qs=document.querySelectorAll(".qi");if(qs.length)qs[qs.length-1].focus()}
  if(a==="addm"){var n=document.getElementById("ni");if(n)n.focus()}
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="sq")renderDd();
  else if(t.id==="gq")renderIng();
  else if(t.id==="fn")draft.name=t.value;
  else if(t.classList.contains("qi"))draft.ing[+t.dataset.r].q=t.value;
});
document.addEventListener("change",function(e){var t=e.target;if(t.classList.contains("ui"))draft.ing[+t.dataset.r].u=t.value;else if(t.classList.contains("gu")){var o=S.ing.find(function(x){return x.n===t.dataset.n});if(o){o.u=t.value;save()}}});
document.addEventListener("focusin",function(e){if(e.target.id==="sq")renderDd()});
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  if(e.target.id==="ni"){var p=parse(e.target.value);if(p.n){add(p.n,p.q,p.u);save();render();var n=document.getElementById("ni");if(n)n.focus()}}
  else if(e.target.id==="gq"){e.preventDefault();var og=document.querySelector("#il .opt");if(og)og.click()}
  else if(e.target.id==="sq"){e.preventDefault();var o=document.querySelector("#dd .opt");if(o)o.click()}
});
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
</script>
</body>
</html>
